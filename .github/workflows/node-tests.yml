name: Investigator tests
on:
  pull_request:
  push:
    branches:
      - implementacion/investigador-local
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Show runtime
        run: node --version
      - name: Run documentary engine and MCP regression tests
        run: node --test tests/engine.test.mjs tests/mcp.test.mjs tests/scheduler.test.mjs tests/remote-experiment-runner.test.mjs tests/github-experiments.test.mjs tests/github-credential.test.mjs tests/github-projects.test.mjs tests/replication-tools.test.mjs tests/timing.test.mjs
      - name: Remote runner smoke experiment (public, no secrets)
        run: node implementation/remote-experiment-runner.mjs experiments/runner-smoke/manifest.json
      - name: Preserve experiment receipt
        uses: actions/upload-artifact@v4
        with:
          name: smoke-experiment-receipt
          path: artifacts/runner-smoke.json
          retention-days: 7
