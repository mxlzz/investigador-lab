name: Investigator tests
on:
  pull_request:
  push:
    branches:
      - implementacion/investigador-local
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Show runtime
        run: node --version
      - name: Run documentary engine and MCP regression tests
        run: node --test tests/engine.test.mjs tests/mcp.test.mjs tests/scheduler.test.mjs
